name: Build PokeSurvivor Android APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - arena/3fca91d3-gg
    paths:
      - 'pokesurvivor-mobile/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pokesurvivor-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install JS deps
        run: npm ci

      - name: Build offline web app
        run: npm run build:web

      - name: Test local accounts and audio lifecycle
        run: npm test

      - name: Install browser for offline smoke test
        run: npx playwright install --with-deps chromium

      - name: Test offline registration and persistence in production page
        run: npm run test:browser

      - name: Stress-test Web Audio playback
        run: npm run test:audio

      - name: Verify imported sprites
        run: npm run assets:verify

      - name: Sync Capacitor (copy www/ into android/)
        run: npm run sync

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: pokesurvivor-mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK has no internet permission
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          "$AAPT" dump permissions android/app/build/outputs/apk/debug/app-debug.apk > apk-permissions.txt
          cat apk-permissions.txt
          if grep -q 'android.permission.INTERNET' apk-permissions.txt; then
            echo "La edición offline no debe tener permiso de internet."
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokesurvivor-debug-apk
          path: pokesurvivor-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Publish downloadable APK
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          name: pokesurvivor-debug-apk
          path: apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: apk-debug-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          mv apk/app-debug.apk apk/pokesurvivor-debug.apk
          cat > release-notes.md <<'NOTES'
          ## PokeSurvivor para Android — cuentas offline

          Descarga **pokesurvivor-debug.apk** en los archivos de esta publicación e instálalo en Android. No es necesario descargar el código fuente ni un ZIP.

          - Menú 1.3: sin Novedades, Amigos, Ranking, Donaciones ni controles de pantalla completa.
          - Audio 1.2: evita ráfagas de notas atrasadas, limita los sonidos simultáneos y libera los nodos al terminar. Menor carga en Android y reanudación al volver a la app.
          - Crea cuentas locales con nombre y contraseña, sin internet, correo ni servidor.
          - Cuenta y progreso guardados en este dispositivo; se restaura la sesión al abrir la app.
          - No hay Firebase, Google, ranking ni cooperativo online. El APK no tiene permiso de internet.
          - Desinstalar la app o borrar sus datos elimina el progreso. No hay recuperación de contraseña ni migración automática de cuentas de la web.
          - Incluye los 13.468 sprites de Pokémon, verificados antes de compilar.
          - Versión de depuración firmada con la clave de debug: no es una versión para Google Play.
          - Android puede pedir autorización para instalar aplicaciones de esta fuente.
          - La clave de depuración puede cambiar entre compilaciones. Si Android rechaza una actualización por firma incompatible, desinstalar la versión anterior borra sus datos locales.
          - Sprites CC BY-NC 4.0 según el proyecto original: uso no comercial y con atribución. Créditos y licencia incluidos en la app y en el repositorio.
          NOTES
          gh release create "$RELEASE_TAG" apk/pokesurvivor-debug.apk \
            --target "$SOURCE_SHA" \
            --title "PokeSurvivor Android offline — $RELEASE_TAG" \
            --notes-file release-notes.md \
            --prerelease
          echo "### APK para descargar" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/pokesurvivor-debug.apk" >> "$GITHUB_STEP_SUMMARY"
