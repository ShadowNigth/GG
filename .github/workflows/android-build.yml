name: Build PokeSurvivor Android APK

on:
  workflow_dispatch: {}
  push:
    branches:
      - arena/3fca91d3-gg
    paths:
      - 'pokesurvivor-mobile/**'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pokesurvivor-mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install JS deps
        run: npm ci

      - name: Verify imported sprites
        run: npm run assets:verify

      - name: Sync Capacitor (copy www/ into android/)
        run: npm run sync

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: pokesurvivor-mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokesurvivor-debug-apk
          path: pokesurvivor-mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
